# Launcher releases: push a tag v<version> to build the launcher for macOS, Linux and
# Windows, each carrying its kit (x2recomp, x2-player, their libraries and the runtime
# sources, see launcher/scripts/stage-kit.sh), and the Android app (typex2-android.apk), into a
# draft GitHub release.
# Releases carry this project's code only: no game files, no recompiled game code.
name: Release

on:
  push:
    tags: ["v*"]


permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in the files
        run: tools/version.sh check "$GITHUB_REF_NAME"
      - name: Draft release, notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          v="${tag#v}"; v="${v%%-*}" # v0.1.0-rc.1: the notes of 0.1.0
          awk -v v="$v" '/^## / {on = index($0, "## " v " ") == 1} on' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          # known issues live in one page (docs/Known-Issues.md), not in the notes
          printf '\n**Known issues:** [docs/Known-Issues.md](https://github.com/%s/blob/main/docs/Known-Issues.md)\n' "$GITHUB_REPOSITORY" >> notes.md
          pre=; case "$tag" in *-*) pre=--prerelease ;; esac
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft $pre --title "typex2-recomp ${tag#v}" --notes-file notes.md

  macos:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: brew install capstone sdl3 ffmpeg ninja pkg-config
      - name: Build x2recomp and x2-player
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target x2recomp x2-player
      - name: Stage the kit
        run: launcher/scripts/stage-kit.sh build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the launcher
        env:
          X2_RELEASE_TAG: ${{ github.ref_name }} # the version the update check compares (updates.rs)
        working-directory: launcher
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        # Tauri names it after Rust's arch (aarch64); players know it as Apple Silicon
        run: |
          dmg="$RUNNER_TEMP/Type.X.Recomp_${GITHUB_REF_NAME#v}_macOS_Apple_Silicon.dmg"
          cp launcher/src-tauri/target/release/bundle/dmg/*.dmg "$dmg"
          gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber

  linux:
    needs: draft
    runs-on: ubuntu-24.04 # the binaries need glibc 2.39 or newer (Ubuntu 24.04+)
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config patchelf libvulkan-dev \
            libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: Build x2recomp and x2-player
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DX2_FETCH_CAPSTONE=ON
          cmake --build build --target x2recomp x2-player
      - name: Stage the kit
        run: launcher/scripts/stage-kit.sh build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the launcher
        env:
          X2_RELEASE_TAG: ${{ github.ref_name }} # the version the update check compares (updates.rs)
        working-directory: launcher
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" launcher/src-tauri/target/release/bundle/appimage/*.AppImage \
            launcher/src-tauri/target/release/bundle/deb/*.deb --clobber

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-capstone mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-headers git
      - name: Build x2recomp and x2-player, stage the kit
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target x2recomp x2-player
          launcher/scripts/stage-kit.sh build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the launcher
        env:
          X2_RELEASE_TAG: ${{ github.ref_name }} # the version the update check compares (updates.rs)
        working-directory: launcher
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" launcher/src-tauri/target/release/bundle/msi/*.msi \
            launcher/src-tauri/target/release/bundle/nsis/*.exe --clobber

  android:
    # the Type X2 app: the launcher for Android with the runtime's game side (libmain, SDL),
    # no game code (games come as packs exported on a computer); signed with the project's key
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$ANDROID_KEYSTORE" || { echo "Set the ANDROID_KEYSTORE secret (base64 of the release keystore)"; exit 1; }
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: The game side (libmain, SDL)
        run: |
          cmake -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-33 -DX2_LIBRETRO=OFF \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF # else CMake scans with the runner's clang-scan-deps, not the NDK's
          cmake --build build-android --target x2app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build the app
        env:
          X2_RELEASE_TAG: ${{ github.ref_name }} # the version the update check compares (updates.rs)
          X2_KEYSTORE: ${{ runner.temp }}/release.keystore
          X2_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: launcher
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci
          npx tauri android build --apk --target aarch64
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$RUNNER_TEMP/typex2-android.apk"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/typex2-android.apk" --clobber

  publish:
    needs: [macos, linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
          *-*) gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false ;; # a release candidate
          *) gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest ;;
          esac
      - name: Post it to Discord's #releases
        env:
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: tools/discord_release.sh "$GITHUB_REF_NAME"
