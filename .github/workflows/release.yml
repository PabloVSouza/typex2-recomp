# Launcher releases: push a tag v<version> to build the launcher for macOS, Linux and
# Windows, each carrying its kit (x2recomp, x2-player, their libraries and the runtime
# sources, see launcher/scripts/stage-kit.sh), into a draft GitHub release.
# Releases carry this project's code only: no game files, no recompiled game code.
name: Release

on:
  push:
    tags: ["v*"]


permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in the files
        run: tools/version.sh check "$GITHUB_REF_NAME"
      - name: Draft release, notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          v="${tag#v}"; v="${v%%-*}" # v0.1.0-rc.1: the notes of 0.1.0
          awk -v v="$v" '/^## / {on = index($0, "## " v " ") == 1} on' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          pre=; case "$tag" in *-*) pre=--prerelease ;; esac
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft $pre --title "typex2-recomp ${tag#v}" --notes-file notes.md

  macos:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: brew install capstone sdl3 ffmpeg ninja pkg-config
      - name: Build x2recomp and x2-player
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target x2recomp x2-player
      - name: Stage the kit
        run: launcher/scripts/stage-kit.sh build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the launcher
        working-directory: launcher
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" launcher/src-tauri/target/release/bundle/dmg/*.dmg --clobber

  linux:
    needs: draft
    runs-on: ubuntu-24.04 # the binaries need glibc 2.39 or newer (Ubuntu 24.04+)
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config patchelf libvulkan-dev \
            libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: Build x2recomp and x2-player
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DX2_FETCH_CAPSTONE=ON
          cmake --build build --target x2recomp x2-player
      - name: Stage the kit
        run: launcher/scripts/stage-kit.sh build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the launcher
        working-directory: launcher
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" launcher/src-tauri/target/release/bundle/appimage/*.AppImage \
            launcher/src-tauri/target/release/bundle/deb/*.deb --clobber

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-capstone mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-headers git
      - name: Build x2recomp and x2-player, stage the kit
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target x2recomp x2-player
          launcher/scripts/stage-kit.sh build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the launcher
        working-directory: launcher
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" launcher/src-tauri/target/release/bundle/msi/*.msi \
            launcher/src-tauri/target/release/bundle/nsis/*.exe --clobber

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
          *-*) gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false ;; # a release candidate
          *) gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest ;;
          esac
