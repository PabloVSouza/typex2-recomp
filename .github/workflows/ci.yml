# Builds the recompiler, the tools, the runtime and x2-player on every push and pull
# request. No game is built: games are recompiled on the user's machine from their own
# files, and none are in this repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version is the same in every file
        run: tools/version.sh check
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config libvulkan-dev \
            libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev patchelf
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DX2_FETCH_CAPSTONE=ON
      - name: Build
        run: cmake --build build
      - name: Smoke test
        run: test -x build/x2-player && test -x build/recompiler/x2recomp
      - name: Stage the launcher kit (as a release does)
        run: launcher/scripts/stage-kit.sh build

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: brew install capstone sdl3 ffmpeg ninja pkg-config
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Smoke test
        run: test -x build/x2-player && test -x build/recompiler/x2recomp
      - name: Stage the launcher kit (as a release does)
        run: launcher/scripts/stage-kit.sh build

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-capstone mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-headers git
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build -- -k 0
      - name: Smoke test
        run: test -f build/x2-player.exe && test -f build/recompiler/x2recomp.exe
      - name: Stage the launcher kit (as a release does)
        run: launcher/scripts/stage-kit.sh build

  launcher:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Front end checks (types, lint, locales) and build
        run: npm ci && npm run check && npm run build

  launcher:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Front end checks (types, lint, locales) and build
        run: npm ci && npm run check && npm run build
